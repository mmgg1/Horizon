          # payload is a sequence of adjacent quoted chunks in parentheses
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as archive:
              for entry in archive.infolist():
                  path = pathlib.Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise RuntimeError('Unsafe filename in archive')
                  target = pathlib.Path('.') / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  content = archive.read(entry)
                  if target.exists() and target.read_bytes() != content:
                      raise RuntimeError(f'Refusing to overwrite an existing file: {path}')
                  target.write_bytes(content)
          PYINSTALL
      - name: Commit integration files (not secrets)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/instagram_radar.py \
            profiles/content-trend-radar/ \
          
            docs/instagram-radar-readme.md docs/instagram-radar-setup.md
          if git diff --cached --quiet; then
            echo 'All integration files are already present.'
          else
            git commit -m 'Add Instagram Apify radar integration (inactive until configured)'
            git push
          fi
