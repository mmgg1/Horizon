name: Instagram radar (Apify to Horizon)

on:
  workflow_dispatch:

# Deliberately manual until costs and API credentials are verified.
# After a successful test, a schedule can be added with explicit approval.
permissions:
  contents: write

concurrency:
  group: instagram-radar
  cancel-in-progress: false

jobs:
  instagram-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read a saved Apify task and build the Horizon feed
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
        run: python scripts/instagram_radar.py
      - name: Detect optional AI key
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo 'AI_READY=true' >> "$GITHUB_ENV"; fi
      - name: Set up uv
        if: ${{ env.AI_READY == 'true' }}
        uses: astral-sh/setup-uv@v6
      - name: Run Horizon for Persian idea analysis (optional)
        if: ${{ env.AI_READY == 'true' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv sync
          python -m http.server 8765 --directory data --bind 127.0.0.1 > /tmp/horizon-rss.log 2>&1 &
          sleep 2
          uv run horizon --config data/instagram_radar/config.json --hours 720
      - name: Commit observed public metrics and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/instagram_radar/history.json data/instagram_radar/reels.xml data/instagram_radar/report.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Instagram Reel radar'
            git push
          fi
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-radar-report
          path: |
            data/instagram_radar/report.md
            data/instagram_radar/reels.xml
          retention-days: 14
